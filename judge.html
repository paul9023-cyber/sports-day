<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#16a34a" />
  <link rel="icon" type="image/png" href="./icons/logo.png" />
  <title>우리동네 체육대회 (심판)</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body class="app-bg">
  <div class="topbar">
    <a class="back" href="./index.html" id="topBack">‹</a>
    <div>
      <div class="title" id="topTitle">심판</div>
      <div class="sub" id="topSub">연결 확인 중…</div>
    </div>
    <span class="pill" id="topPill"></span>
  </div>

  <!-- 화면 1: 반 선택 -->
  <div class="section" id="screen-class">
    <div class="card">
      <h2>우리 반 선택</h2>
      <p class="muted small">이 휴대폰이 기록할 반을 선택하세요. 선택은 기기에 저장됩니다.</p>
      <div id="classGroupList"></div>
    </div>
  </div>

  <!-- 심판자 정보 입력 모달 -->
  <div id="judgeInfoModal" class="modal-backdrop hidden" style="align-items:center;">
    <div class="modal" style="max-width: 380px;">
      <h3 style="margin:0 0 6px;text-align:center;">심판자 정보</h3>
      <p class="small muted" style="margin:0 0 14px;text-align:center;" id="judgeInfoSubtitle">
        학번과 이름을 입력해 주세요
      </p>

      <div class="label">학번</div>
      <input id="judgeStudentNo" class="input" type="text" inputmode="text"
             autocomplete="off" maxlength="20" placeholder="예) 20231 또는 1학년 5반 23번" />

      <div class="spacer"></div>
      <div class="label">이름</div>
      <input id="judgeStudentName" class="input" type="text"
             autocomplete="off" maxlength="20" placeholder="예) 김지훈" />

      <div id="judgeInfoError" class="small" style="color:#fca5a5;min-height:18px;margin-top:8px"></div>

      <div class="spacer"></div>
      <div class="row">
        <button class="btn btn-ghost" id="judgeInfoCancel" style="flex:0 0 auto;">뒤로</button>
        <button class="btn btn-success" id="judgeInfoOk">확인</button>
      </div>
    </div>
  </div>

  <!-- 화면 2: 종목 리스트 -->
  <div class="section hidden" id="screen-games">
    <div class="card">
      <h2>종목 선택</h2>
      <div class="small muted" id="judgeWho" style="margin:-6px 0 10px"></div>
      <div id="judgeGameList"></div>
    </div>
    <div class="row">
      <button class="btn btn-ghost" id="editInfoBtn" style="flex:1">정보 변경</button>
      <button class="btn btn-ghost" id="changeClassBtn" style="flex:1">반 변경</button>
    </div>
  </div>

  <!-- 화면 3: 점수(휠) 입력 -->
  <div class="section hidden" id="screen-points">
    <div class="card">
      <h2 id="pGameName">-</h2>
      <p class="muted small">10점부터 180점까지 10점 단위로 선택하세요.</p>
      <div class="spacer"></div>
      <div class="wheel-picker">
        <div class="wheel-indicator"></div>
        <div class="wheel-mask-top"></div>
        <div class="wheel-mask-bottom"></div>
        <div class="wheel-scroll" id="wheelScroll"></div>
      </div>
      <div class="spacer"></div>
      <div class="row">
        <button class="btn btn-ghost" id="pBack">돌아가기</button>
        <button class="btn btn-success" id="pSubmit">제출</button>
      </div>
      <div class="spacer"></div>
      <button class="btn btn-danger btn-block hidden" id="pDelete">이 반의 기록 삭제</button>
    </div>
  </div>

  <!-- 화면 4: 타임랩 -->
  <div class="section hidden" id="screen-time">
    <div class="card">
      <h2 id="tGameName">-</h2>
      <p class="muted small">시작 버튼을 누르면 타이머가 시작되고, 끝 버튼을 누르면 기록이 확정됩니다.</p>
      <div class="time-display" id="tDisplay">00:00.<span class="ms">00</span></div>
      <div class="time-buttons">
        <button class="circle-btn" id="tStart">시작</button>
        <button class="circle-btn reset hidden" id="tReset">초기화</button>
      </div>
      <div class="row">
        <button class="btn btn-ghost" id="tBack">돌아가기</button>
        <button class="btn btn-success" id="tSubmit" disabled>제출</button>
      </div>
      <div class="spacer"></div>
      <button class="btn btn-danger btn-block hidden" id="tDelete">이 반의 기록 삭제</button>
    </div>
  </div>

  <script type="module" src="./js/judge.js"></script>
</body>
</html>
