<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1e3a8a" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <title>우리동네 체육대회 (본부)</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body class="app-bg">
  <div class="topbar">
    <a class="back" href="./index.html">‹</a>
    <div>
      <div class="title">본부</div>
      <div class="sub" id="connText">연결 확인 중…</div>
    </div>
    <button id="hqShareBtn" class="pill" style="cursor:pointer;border:none;background:#1e40af;color:#fff;">
      📱 심판 초대
    </button>
    <span class="pill" id="schoolPill">학교 미설정</span>
  </div>

  <!-- 심판 초대 QR 모달 -->
  <div id="hqConnectModal" class="modal-backdrop hidden" style="align-items:center;">
    <div class="modal" style="max-width: 440px; text-align:center;">
      <h3 style="margin:0 0 6px">심판들에게 공유</h3>
      <div class="seg" id="hqConnTabs" style="max-width:320px;margin:0 auto 14px;">
        <button data-htab="tunnel" class="active">📶 데이터망</button>
        <button data-htab="local">📡 같은 Wi-Fi</button>
      </div>

      <div id="hqcpanel-tunnel">
        <div id="hqTunnelReady" class="hidden">
          <div id="hqQrWrap" style="background:#fff;padding:12px;border-radius:14px;display:inline-block;width:300px;height:300px;box-sizing:content-box;"></div>
          <div id="hqTunnelUrl" style="margin-top:14px;font-family:Consolas,monospace;font-size:14px;font-weight:700;color:#93c5fd;word-break:break-all;">-</div>
          <p class="small muted" style="margin-top:10px">
            🚀 심판 휴대폰 카메라로 이 QR을 스캔 — 데이터망·Wi-Fi 어디서든 OK
          </p>
        </div>
        <div id="hqTunnelLoading">
          <div style="padding:40px 20px">
            <div class="spinner" style="margin:0 auto 14px"></div>
            <div id="hqTunnelStatusText" class="small muted">공개 주소 생성 중...</div>
          </div>
        </div>
        <div id="hqTunnelError" class="hidden">
          <p style="color:#fca5a5">⚠ 공개 주소 생성 실패</p>
          <p id="hqTunnelErrorMsg" class="small muted"></p>
        </div>
      </div>

      <div id="hqcpanel-local" class="hidden">
        <div id="hqQrWrapLocal" style="background:#fff;padding:12px;border-radius:14px;display:inline-block;width:300px;height:300px;box-sizing:content-box;"></div>
        <div id="hqLocalUrl" style="margin-top:14px;font-family:Consolas,monospace;font-size:16px;font-weight:700;color:#86efac;word-break:break-all;">-</div>
        <p class="small muted" style="margin-top:10px">
          💡 PC와 같은 Wi-Fi에 연결된 휴대폰만 접속 가능
        </p>
      </div>

      <div class="spacer"></div>
      <button class="btn btn-block" id="hqCloseConnectBtn">닫기</button>
    </div>
  </div>

  <div class="section">
    <div class="seg" id="tabs">
      <button data-tab="setup" class="active">설정</button>
      <button data-tab="live">실시간 현황</button>
      <button data-tab="total">종합 등수</button>
    </div>

    <div class="spacer"></div>

    <!-- 설정 탭 -->
    <div id="tab-setup">
      <div class="card">
        <h2>학교 이름</h2>
        <div class="row">
          <input id="schoolInput" class="input" placeholder="예) 햇살초등학교" maxlength="40" />
          <button class="btn" id="saveSchool" style="flex:0 0 auto;">저장</button>
        </div>
      </div>

      <div class="card">
        <h2>학년 / 반 구성</h2>
        <p class="small muted" style="margin:0 0 10px">
          학년 수와 각 학년의 반 수를 설정하세요. (예: 3학년 × 10반 = 총 30개 반)
        </p>
        <div class="row">
          <div>
            <div class="label">학년 수</div>
            <input id="gradesInput" class="input" type="number" min="1" max="12" />
          </div>
          <div>
            <div class="label">각 학년의 반 수</div>
            <input id="classesPerGradeInput" class="input" type="number" min="1" max="30" />
          </div>
        </div>
        <div class="spacer"></div>
        <div class="row">
          <div class="small muted" id="structureSummary" style="padding:10px 0;">-</div>
          <button class="btn" id="saveStructure" style="flex:0 0 auto;">저장</button>
        </div>
      </div>

      <div class="card">
        <h2>종목 추가</h2>
        <input id="gameName" class="input" placeholder="종목 이름 (예: 이어달리기)" maxlength="30" />
        <div class="spacer"></div>
        <div class="label">점수 방식</div>
        <div class="seg" id="gameTypeSeg">
          <button data-type="points" class="active">점수 입력 (10~180점)</button>
          <button data-type="time">Time lap (분:초.밀리)</button>
        </div>
        <div class="spacer"></div>
        <button class="btn btn-block btn-success" id="addGame">＋ 종목 추가</button>
      </div>

      <div class="card">
        <h2>등록된 종목</h2>
        <div id="gameList"></div>
      </div>

      <div class="card">
        <h2>초기화</h2>
        <p class="small muted" style="margin:0 0 10px">대회를 다시 시작할 때 사용하세요.</p>
        <div class="row">
          <button class="btn btn-ghost" id="resetScoresBtn">점수만 초기화</button>
          <button class="btn btn-danger" id="resetAllBtn">전체 초기화</button>
        </div>
      </div>
    </div>

    <!-- 실시간 탭 -->
    <div id="tab-live" class="hidden">
      <div id="liveList"></div>
    </div>

    <!-- 종합 탭 -->
    <div id="tab-total" class="hidden">
      <div class="card">
        <h2>종합 등수 <span class="small muted">(모든 종목 점수 합산)</span></h2>
        <div id="totalRank"></div>
      </div>
    </div>

  </div>

  <script type="module" src="./js/hq.js"></script>
</body>
</html>
