<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1e3a8a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="우리동네 체육대회" />
  <link rel="icon" type="image/png" href="./icons/logo.png" />
  <title>우리동네 체육대회</title>
  <link rel="stylesheet" href="./css/style.css" />
  <script>
    // 모든 JS 에러를 화면 상단에 빨간 박스로 표시 (모바일 디버그 용도)
    (function () {
      function showErr(msg) {
        var box = document.getElementById("__errBox");
        if (!box) {
          box = document.createElement("div");
          box.id = "__errBox";
          box.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:99999;background:#dc2626;color:#fff;padding:10px 14px;font-size:12px;font-family:monospace;white-space:pre-wrap;max-height:40vh;overflow:auto;border-bottom:3px solid #fca5a5;";
          (document.body || document.documentElement).appendChild(box);
        }
        box.textContent += msg + "\n";
      }
      window.addEventListener("error", function (e) {
        showErr("[JS ERROR] " + (e.message || e.error) + " @ " + (e.filename || "?") + ":" + (e.lineno || "?"));
      });
      window.addEventListener("unhandledrejection", function (e) {
        showErr("[Promise REJECT] " + (e.reason && (e.reason.message || e.reason)));
      });
    })();
  </script>
</head>
<body class="home-body">
  <div class="home-wrap">
    <div class="home-hero">
      <div class="home-logo">
        <img src="./icons/logo.png" alt="로고" />
      </div>
      <h1>우리동네<br/>체육대회</h1>
      <p class="home-school" id="homeSchool">학교명 불러오는 중…</p>
    </div>

    <div class="home-actions">
      <button class="role-card role-hq" data-role="hq">
        <div class="role-icon">🏆</div>
        <div class="role-text">
          <div class="role-title">본부</div>
          <div class="role-sub">종목 관리 · 실시간 집계</div>
        </div>
        <div class="role-arrow">›</div>
      </button>

      <button class="role-card role-judge" data-role="judge">
        <div class="role-icon">🏁</div>
        <div class="role-text">
          <div class="role-title">심판</div>
          <div class="role-sub">점수 · 기록 입력</div>
        </div>
        <div class="role-arrow">›</div>
      </button>
    </div>

    <div class="home-footer">
      <span id="connectionStatus" class="conn-dot conn-off">연결 확인 중</span>
      <div class="spacer"></div>
      <button id="showConnectBtn" class="btn btn-ghost" style="font-size:13px;padding:10px 14px;">
        📱 휴대폰으로 접속하기
      </button>
    </div>
  </div>

  <!-- 본부 비밀번호 모달 -->
  <div id="hqPwdModal" class="modal-backdrop hidden" style="align-items:center;">
    <div class="modal" style="max-width: 360px; text-align:center;">
      <h3 style="margin:0 0 6px">본부 접속</h3>
      <p class="small muted" style="margin:0 0 14px">관리자 비밀번호를 입력하세요.</p>
      <input id="hqPwdInput" type="password" inputmode="numeric" autocomplete="off" class="input"
             maxlength="16" placeholder="비밀번호"
             style="text-align:center;font-size:20px;letter-spacing:6px;" />
      <div id="hqPwdError" class="small" style="color:#fca5a5;min-height:18px;margin-top:6px"></div>
      <div class="spacer"></div>
      <div class="row">
        <button class="btn btn-ghost" id="hqPwdCancel">취소</button>
        <button class="btn btn-success" id="hqPwdOk">확인</button>
      </div>
    </div>
  </div>

  <!-- 접속 QR 모달 -->
  <div id="connectModal" class="modal-backdrop hidden" style="align-items:center;">
    <div class="modal" style="max-width: 440px; text-align:center;">
      <h3 style="margin:0 0 6px">휴대폰에서 접속</h3>

      <!-- 탭: 데이터망 / Wi-Fi -->
      <div class="seg" id="connTabs" style="max-width:320px;margin:0 auto 14px;">
        <button data-ctab="tunnel" class="active">📶 데이터망 (어디서든)</button>
        <button data-ctab="local">📡 같은 Wi-Fi</button>
      </div>

      <!-- 데이터망 패널 -->
      <div id="cpanel-tunnel">
        <div id="tunnelReady" class="hidden">
          <div id="qrWrap" style="background:#fff;padding:12px;border-radius:14px;display:inline-block;width:300px;height:300px;box-sizing:content-box;"></div>
          <div id="tunnelUrl" style="margin-top:14px;font-family:Consolas,monospace;font-size:14px;font-weight:700;color:#93c5fd;word-break:break-all;">-</div>
          <p class="small muted" style="margin-top:10px">
            🚀 LTE/5G 데이터로도 접속 가능. 같은 Wi-Fi 필요 없음.
          </p>
        </div>
        <div id="tunnelLoading">
          <div style="padding:40px 20px">
            <div class="spinner" style="margin:0 auto 14px"></div>
            <div id="tunnelStatusText" class="small muted">공개 주소 생성 중... (최초 실행 시 1~2분 소요)</div>
          </div>
        </div>
        <div id="tunnelError" class="hidden">
          <p style="color:#fca5a5">⚠ 공개 주소 생성 실패</p>
          <p id="tunnelErrorMsg" class="small muted"></p>
          <p class="small muted">
            인터넷 연결을 확인하거나 PC 창을 닫고 <code>run.bat</code>을 다시 실행해 보세요.<br/>
            옆 탭의 <b>Wi-Fi 접속</b>은 사용 가능합니다.
          </p>
        </div>
      </div>

      <!-- 로컬 Wi-Fi 패널 -->
      <div id="cpanel-local" class="hidden">
        <div id="qrWrapLocal" style="background:#fff;padding:12px;border-radius:14px;display:inline-block;width:300px;height:300px;box-sizing:content-box;"></div>
        <div id="localUrl" style="margin-top:14px;font-family:Consolas,monospace;font-size:16px;font-weight:700;color:#86efac;word-break:break-all;">-</div>
        <p class="small muted" style="margin-top:10px">
          💡 PC와 같은 Wi-Fi에 연결된 휴대폰만 접속 가능.
        </p>
      </div>

      <div class="spacer"></div>
      <button class="btn btn-block" id="closeConnectBtn">닫기</button>
    </div>
  </div>

  <script type="module" src="./js/home.js"></script>
</body>
</html>
